<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 250px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            margin: 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin: 0 0 5px 0;
        }
        
        .subtitle {
            font-size: 12px;
            color: #666;
            margin: 0;
        }
        
        .button {
            width: 100%;
            padding: 12px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .button:hover {
            background: #3367d6;
        }
        
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 15px 0 10px 0;
        }

        .controls label {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
        }

        .controls select {
            flex: 1;
            padding: 6px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }

        .status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
            display: none;
        }
        
        .status.success {
            background: #e8f5e8;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        
        .status.info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #bbdefb;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">Duplicate Tab Closer</h1>
        <p class="subtitle">Close duplicate tabs instantly</p>
    </div>
    
    <div class="controls">
        <label for="sortMode">Sort tabs by:</label>
        <select id="sortMode">
            <option value="url">URL</option>
            <option value="recent">Recent usage</option>
        </select>
    </div>

    <button id="cleanUp" class="button">Sort &amp; Close Duplicates</button>

    <div id="status" class="status"></div>
    
    <script src="tabs.js"></script>
    <script src="groups.js"></script>
    <script src="cleanup.js"></script>
    <script src="popup.js"></script>
</body>
</html>
